name: Android ARM64 Clean Build

on:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: clean-1.4.6

      - name: Fix submodules
        run: |
          git submodule sync
          git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            git \
            libclang-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.75
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.1.2 --locked

      - name: Flutter pub get
        working-directory: flutter
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Build Android deps
        env:
          VCPKG_ROOT: /opt/artifacts/vcpkg
          VCPKG_BINARY_SOURCES: clear
        run: |
          chmod +x flutter/build_android_deps.sh
          ./flutter/build_android_deps.sh arm64-v8a

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
          VCPKG_BINARY_SOURCES: clear
        run: |
          chmod +x flutter/ndk_arm64.sh
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          ls -lh flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: flutter
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android-arm64-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk