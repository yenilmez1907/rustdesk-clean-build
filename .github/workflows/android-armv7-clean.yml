name: Android ARMv7 Clean Build

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r27c"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android-armv7:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Fix submodules
        run: |
          git submodule sync
          git submodule update --init --recursive --force

      - name: Patch embedded Android server config

        shell: bash

        run: |

          python3 <<'PY'

          from pathlib import Path

      

          path = Path("libs/hbb_common/src/config.rs")

          content = path.read_text()

      

          if "BB CUSTOM SERVER CONFIG" not in content:

              old_get_options = '''    pub fn get_options() -> HashMap<String, String> {

              let mut res = DEFAULT_SETTINGS.read().unwrap().clone();

              res.extend(CONFIG2.read().unwrap().options.clone());

              res.extend(OVERWRITE_SETTINGS.read().unwrap().clone());

              res

          }

      '''

      

              new_get_options = '''    pub fn get_options() -> HashMap<String, String> {

              let mut res = DEFAULT_SETTINGS.read().unwrap().clone();

              res.extend(CONFIG2.read().unwrap().options.clone());

              res.extend(OVERWRITE_SETTINGS.read().unwrap().clone());

      

              #[cfg(target_os = "android")]

              {

                  // BB CUSTOM SERVER CONFIG

                  res.insert("custom-rendezvous-server".to_owned(), "destek.bb.com.tr".to_owned());

                  res.insert("relay-server".to_owned(), "destek.bb.com.tr".to_owned());

                  res.insert("api-server".to_owned(), "https://destek.bb.com.tr".to_owned());

                  res.insert("key".to_owned(), "LjQ3Z0Y27ekoHMm8nOEFZNumk3q3XOye6uim3iyyoEk=".to_owned());

              }

      

              res

          }

      '''

      

              old_get_option = '''    pub fn get_option(k: &str) -> String {

              get_or(

                  &OVERWRITE_SETTINGS,

                  &CONFIG2.read().unwrap().options,

                  &DEFAULT_SETTINGS,

                  k,

              )

              .unwrap_or_default()

          }

      '''

      

              new_get_option = '''    pub fn get_option(k: &str) -> String {

              #[cfg(target_os = "android")]

              {

                  match k {

                      // BB CUSTOM SERVER CONFIG

                      "custom-rendezvous-server" => return "destek.bb.com.tr".to_owned(),

                      "relay-server" => return "destek.bb.com.tr".to_owned(),

                      "api-server" => return "https://destek.bb.com.tr".to_owned(),

                      "key" => return "LjQ3Z0Y27ekoHMm8nOEFZNumk3q3XOye6uim3iyyoEk=".to_owned(),

                      _ => {}

                  }

              }

      

              get_or(

                  &OVERWRITE_SETTINGS,

                  &CONFIG2.read().unwrap().options,

                  &DEFAULT_SETTINGS,

                  k,

              )

              .unwrap_or_default()

          }

      '''

      

              if old_get_options not in content:

                  raise SystemExit("get_options block not found for embedded config patch")

              if old_get_option not in content:

                  raise SystemExit("get_option block not found for embedded config patch")

      

              content = content.replace(old_get_options, new_get_options, 1)

              content = content.replace(old_get_option, new_get_option, 1)

              path.write_text(content)

      

          print("BB embedded Android server config patch OK")

          PY

      - name: Verify rotation patch is included
        run: |
          echo "Current branch/ref: ${{ github.ref_name }}"
          git log -1 --oneline
          grep -n "bbRotationMode" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          grep -n "rotateFrameIfNeeded" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          grep -n "captureWidth" flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            gcc-multilib \
            git \
            g++ \
            g++-multilib \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpam0g-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            tree \
            wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch Flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Build Android deps
        env:
          VCPKG_ROOT: /opt/artifacts/vcpkg
          VCPKG_BINARY_SOURCES: clear
        run: |
          chmod +x flutter/build_android_deps.sh
          if ! ./flutter/build_android_deps.sh armeabi-v7a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "$f:"
              echo "======"
              cat "$f"
              echo "======"
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: armv7-linux-androideabi
          components: rustfmt

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Build rustdesk native lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
          VCPKG_BINARY_SOURCES: clear
          RUST_BACKTRACE: "1"
        run: |
          chmod +x flutter/ndk_arm.sh
          ./flutter/ndk_arm.sh

          mkdir -p flutter/android/app/src/main/jniLibs/armeabi-v7a

          cp target/armv7-linux-androideabi/release/liblibrustdesk.so \
            flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so

          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so \
            flutter/android/app/src/main/jniLibs/armeabi-v7a/

          ls -lh flutter/android/app/src/main/jniLibs/armeabi-v7a/

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH

          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties || true
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle || true

          pushd flutter
          flutter build apk --release --target-platform android-arm --split-per-abi
          popd

          mkdir -p signed-apk
          cp flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk signed-apk/rustdesk-${VERSION}-armv7.apk
          ls -lh signed-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android-armv7-apk
          path: signed-apk/*.apk
